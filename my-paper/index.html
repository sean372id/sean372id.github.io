<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAPER STOK // S.A. PAPER TRACKER</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;0,800;1,800&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">

  <style>
    /* STRICT NEO-BRUTALISM SYSTEM OVERRIDES */
    * {
      border-radius: 0px !important; /* Sharp 0px corners everywhere */
      font-family: 'JetBrains Mono', monospace;
      box-sizing: border-box;
    }
    
    h1, h2, h3, h4, h5, .font-heading {
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: -0.03em;
    }

    /* Custom Hard Shadows */
    .brutal-border {
      border: 3px solid #000000;
    }

    .brutal-border-4 {
      border: 4px solid #000000;
    }

    .brutal-shadow {
      box-shadow: 4px 4px 0px #000000;
    }

    .brutal-shadow-lg {
      box-shadow: 7px 7px 0px #000000;
    }

    .brutal-shadow-sm {
      box-shadow: 2px 2px 0px #000000;
    }

    /* Interactive Brutalist Button Effects */
    .brutal-btn {
      border: 3px solid #000000;
      box-shadow: 4px 4px 0px #000000;
      transition: transform 0.05s ease, box-shadow 0.05s ease;
      cursor: pointer;
      font-weight: 800;
      text-transform: uppercase;
    }

    .brutal-btn:hover {
      transform: translate(-3px, -3px);
      box-shadow: 7px 7px 0px #000000;
    }

    .brutal-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    .brutal-input {
      border: 3px solid #000000;
      background-color: #FFFFFF;
      padding: 10px 14px;
      font-weight: 700;
      outline: none;
      box-shadow: 3px 3px 0px #000000;
    }

    .brutal-input:focus {
      background-color: #FFFDF0;
      box-shadow: 5px 5px 0px #000000;
    }

    /* Brutalist Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }
    ::-webkit-scrollbar-track {
      background: #F4F0EA;
      border: 3px solid #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #FFD600;
    }
  </style>
</head>
<body class="bg-[#F4F0EA] text-black min-h-screen selection:bg-[#FFD600] selection:text-black pb-16">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- INITIAL DATA & CONSTANTS ---
    const DEFAULT_PAPER_TYPES = ["A4 70gr", "A4 80gr", "F4 70gr", "A3 80gr", "Premium Photo"];
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwMBt_I3iHMsvmrTlwA-re4wgYG0Zp5Hj4hJsc7dAJ10qWL2KtVeqrzaYc6X6SGFXEHbA/exec";
    
    const INITIAL_TRANSACTIONS = [
      {
        id: "TX-1001",
        timestamp: new Date(Date.now() - 86400000 * 2).toISOString(),
        dateStr: new Date(Date.now() - 86400000 * 2).toLocaleDateString("id-ID"),
        timeStr: "09:30",
        type: "RESTOCK",
        paperType: "A4 70gr",
        quantity: 1000, // in sheets (2 Rims)
        user: "Budi (Logistik)",
        notes: "Restock Toko PaperJaya (2 Rim)"
      },
      {
        id: "TX-1002",
        timestamp: new Date().toISOString(),
        dateStr: new Date().toLocaleDateString("id-ID"),
        timeStr: "11:15",
        type: "PRINT",
        paperType: "A4 70gr",
        quantity: 150,
        user: "Siti (Desain)",
        notes: "Cetak Buku Laporan Bulanan"
      },
      {
        id: "TX-1003",
        timestamp: new Date().toISOString(),
        dateStr: new Date().toLocaleDateString("id-ID"),
        timeStr: "14:20",
        type: "RESTOCK",
        paperType: "A3 80gr",
        quantity: 500,
        user: "Agus (Purchasing)",
        notes: "Pengadaan Poster Kertas A3"
      },
      {
        id: "TX-1004",
        timestamp: new Date().toISOString(),
        dateStr: new Date().toLocaleDateString("id-ID"),
        timeStr: "15:45",
        type: "PRINT",
        paperType: "Premium Photo",
        quantity: 25,
        user: "Rian (Studio)",
        notes: "Print Sample Foto Portofolio"
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      // States
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem("BRUTAL_PAPER_LOGS");
        return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
      });

      // UI Modals & Active Tabs
      const [activeTab, setActiveTab] = useState("RESTOCK"); // 'RESTOCK' or 'PRINT'
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);
      const [toast, setToast] = useState(null);

      // Filters
      const [filterType, setFilterType] = useState("ALL");
      const [filterPaper, setFilterPaper] = useState("ALL");
      const [searchTerm, setSearchTerm] = useState("");

      // Form Data States
      const [restockForm, setRestockForm] = useState({
        paperType: "A4 70gr",
        unitType: "rim", // 'rim' or 'sheet'
        quantityValue: "",
        user: "",
        notes: ""
      });

      const [printForm, setPrintForm] = useState({
        paperType: "A4 70gr",
        quantitySheets: "",
        user: "",
        notes: ""
      });

      // Save to localStorage on change
      useEffect(() => {
        localStorage.setItem("BRUTAL_PAPER_LOGS", JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.removeItem("BRUTAL_GAS_URL");
      }, []);

      // Toast notification display helper
      const triggerToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // --- CALCULATED STATS ---
      const stockSummary = useMemo(() => {
        const summary = {};
        DEFAULT_PAPER_TYPES.forEach(pt => summary[pt] = 0);

        transactions.forEach(t => {
          if (!summary[t.paperType]) summary[t.paperType] = 0;
          if (t.type === "RESTOCK") {
            summary[t.paperType] += Number(t.quantity);
          } else if (t.type === "PRINT") {
            summary[t.paperType] -= Number(t.quantity);
          }
        });
        return summary;
      }, [transactions]);

      const totalStockSheets = useMemo(() => {
        return Object.values(stockSummary).reduce((acc, curr) => acc + Math.max(0, curr), 0);
      }, [stockSummary]);

      const todayStr = new Date().toLocaleDateString("id-ID");

      const todayStats = useMemo(() => {
        let printedToday = 0;
        let restockedToday = 0;

        transactions.forEach(t => {
          if (t.dateStr === todayStr) {
            if (t.type === "PRINT") printedToday += Number(t.quantity);
            if (t.type === "RESTOCK") restockedToday += Number(t.quantity);
          }
        });

        return { printedToday, restockedToday };
      }, [transactions, todayStr]);

      const lowStockAlerts = useMemo(() => {
        return Object.entries(stockSummary).filter(([type, count]) => count < 100);
      }, [stockSummary]);

      // --- HANDLERS ---
      const handleAddRestock = (e) => {
        e.preventDefault();
        const qtyNum = parseInt(restockForm.quantityValue);
        if (!qtyNum || qtyNum <= 0) {
          triggerToast("Masukkan jumlah kertas restock yang valid!", "error");
          return;
        }

        // Convert rim to sheets if needed (1 Rim = 500 sheets)
        const totalSheets = restockForm.unitType === "rim" ? qtyNum * 500 : qtyNum;
        const now = new Date();

        const newLog = {
          id: "TX-" + Date.now().toString().slice(-6),
          timestamp: now.toISOString(),
          dateStr: now.toLocaleDateString("id-ID"),
          timeStr: now.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }),
          type: "RESTOCK",
          paperType: restockForm.paperType,
          quantity: totalSheets,
          user: restockForm.user.trim() || "Petugas Stok",
          notes: restockForm.notes.trim() || `Restock +${qtyNum} ${restockForm.unitType.toUpperCase()}`
        };

        setTransactions(prev => [newLog, ...prev]);
        syncToGAS(newLog);

        setRestockForm({ paperType: "A4 70gr", unitType: "rim", quantityValue: "", user: "", notes: "" });
        triggerToast(`BERHASIL: Restock +${totalSheets} lembar ${newLog.paperType}!`);
      };

      const handleAddPrint = (e) => {
        e.preventDefault();
        const qtyNum = parseInt(printForm.quantitySheets);
        if (!qtyNum || qtyNum <= 0) {
          triggerToast("Masukkan jumlah lembar print yang valid!", "error");
          return;
        }

        const available = stockSummary[printForm.paperType] || 0;
        if (qtyNum > available) {
          triggerToast(`STOK TIDAK CUKUP! Tersisa ${available} lembar untuk ${printForm.paperType}`, "error");
          return;
        }

        const now = new Date();
        const newLog = {
          id: "TX-" + Date.now().toString().slice(-6),
          timestamp: now.toISOString(),
          dateStr: now.toLocaleDateString("id-ID"),
          timeStr: now.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }),
          type: "PRINT",
          paperType: printForm.paperType,
          quantity: qtyNum,
          user: printForm.user.trim() || "User Operator",
          notes: printForm.notes.trim() || "Cetak Dokumen Hari Ini"
        };

        setTransactions(prev => [newLog, ...prev]);
        syncToGAS(newLog);

        setPrintForm({ paperType: "A4 70gr", quantitySheets: "", user: "", notes: "" });
        triggerToast(`BERHASIL: Catat Print -${qtyNum} lembar (${newLog.paperType})!`);
      };

      const handleDeleteTransaction = (id) => {
        setTransactions(prev => prev.filter(t => t.id !== id));
        setDeleteConfirmId(null);
        triggerToast(`Transaksi #${id} berhasil dihapus.`);

        sendToGAS({ action: "DELETE", id });
      };

      const getGasEndpoint = () => {
        if (!GAS_WEB_APP_URL) return "";

        try {
          const endpoint = new URL(GAS_WEB_APP_URL);
          if (
            endpoint.protocol !== "https:" ||
            endpoint.hostname !== "script.google.com" ||
            !/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint.pathname) ||
            endpoint.username ||
            endpoint.password ||
            endpoint.search ||
            endpoint.hash
          ) {
            throw new Error("URL Web App GAS tidak valid.");
          }
          return endpoint.toString();
        } catch (error) {
          console.error("GAS configuration error:", error);
          triggerToast("URL GAS tidak valid. Data tetap tersimpan di browser.", "error");
          return "";
        }
      };

      const sendToGAS = async (payload) => {
        const endpoint = getGasEndpoint();
        if (!endpoint) return;

        try {
          await fetch(endpoint, {
            method: "POST",
            mode: "no-cors",
            credentials: "include",
            headers: { "Content-Type": "text/plain;charset=UTF-8" },
            body: JSON.stringify(payload)
          });
          triggerToast("Permintaan dikirim ke GAS; statusnya tidak dapat diverifikasi dari browser.", "info");
        } catch (error) {
          console.error("GAS request error:", error);
          triggerToast("Pengiriman ke GAS gagal. Data lokal tetap tersimpan.", "error");
        }
      };

      const syncToGAS = (logItem) => {
        sendToGAS({ action: "ADD_TRANSACTION", payload: logItem });
      };

      // --- FILTER LOGIC ---
      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchType = filterType === "ALL" || t.type === filterType;
          const matchPaper = filterPaper === "ALL" || t.paperType === filterPaper;
          const searchLower = searchTerm.toLowerCase();
          const matchSearch = !searchTerm || 
            t.id.toLowerCase().includes(searchLower) ||
            t.user.toLowerCase().includes(searchLower) ||
            t.notes.toLowerCase().includes(searchLower) ||
            t.paperType.toLowerCase().includes(searchLower);

          return matchType && matchPaper && matchSearch;
        });
      }, [transactions, filterType, filterPaper, searchTerm]);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6">
          
          {/* TOAST NOTIFICATION BANNER */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 p-4 brutal-border-4 brutal-shadow-lg font-bold flex items-center justify-between gap-4 transition-all ${
              toast.type === "error" ? "bg-[#FF2A6D] text-white" : toast.type === "info" ? "bg-[#00E5FF] text-black" : "bg-[#05FF00] text-black"
            }`}>
              <div className="flex items-center gap-2">
                <span className="text-xl">{toast.type === "error" ? "⚠️" : "⚡"}</span>
                <span>{toast.message}</span>
              </div>
              <button onClick={() => setToast(null)} className="ml-4 font-black text-lg hover:opacity-75">[X]</button>
            </div>
          )}

          {/* HEADER SECTION */}
          <header className="bg-[#FFFFFF] brutal-border-4 brutal-shadow-lg p-5 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <div className="flex items-center gap-2">
                <div className="w-5 h-5 bg-[#FFD600] brutal-border"></div>
                <span className="text-xs font-black tracking-widest bg-[#000000] text-[#FFFFFF] px-2 py-0.5">V 1.0 // PURE NEO-BRUTALISM</span>
              </div>
              <h1 className="text-3xl sm:text-4xl font-black text-black tracking-tight mt-1">
                PAPER STOK <span className="bg-[#FFD600] px-2 brutal-border-2">// S.A. PAPER TRACKER</span>
              </h1>
              <p className="text-xs font-bold text-gray-700 mt-1">Sistem Kontrol Stok Kertas & Log Cetak Harian</p>
            </div>

          </header>

          {/* WARNING ALERT FOR LOW STOCK */}
          {lowStockAlerts.length > 0 && (
            <div className="bg-[#FF2A6D] text-white brutal-border-4 brutal-shadow p-4 mb-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <span className="text-3xl bg-black text-[#FF2A6D] px-3 py-1 font-black brutal-border">!</span>
                <div>
                  <h3 className="font-black text-lg uppercase tracking-wider">PERINGATAN STOK MENIPIS (&lt; 100 LEMBAR)</h3>
                  <p className="text-xs font-bold text-black bg-white inline-block px-2 py-0.5 mt-1 brutal-border">
                    Jenis Kertas Kritis: {lowStockAlerts.map(([type, qty]) => `${type} (${qty} lbr)`).join(", ")}
                  </p>
                </div>
              </div>
              <button 
                onClick={() => setActiveTab("RESTOCK")} 
                className="brutal-btn bg-[#FFD600] text-black px-4 py-2 text-xs whitespace-nowrap self-end sm:self-center"
              >
                + SEGERA RESTOCK
              </button>
            </div>
          )}

          {/* DASHBOARD STATS GRID */}
          <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
            
            {/* TOTAL AVAILABLE STOCK */}
            <div className="bg-[#FFD600] brutal-border-4 brutal-shadow p-5 flex flex-col justify-between">
              <div>
                <span className="text-xs font-black uppercase bg-black text-[#FFD600] px-2 py-0.5 brutal-border-sm">
                  TOTAL STOK TERSEDIA
                </span>
                <div className="text-4xl sm:text-5xl font-black mt-3 text-black">
                  {totalStockSheets.toLocaleString("id-ID")}
                  <span className="text-base font-bold ml-1">lembar</span>
                </div>
              </div>
              <div className="mt-4 pt-3 border-t-2 border-black flex justify-between text-xs font-extrabold">
                <span>ESTIMASI RIM:</span>
                <span className="bg-white px-2 border-2 border-black">{(totalStockSheets / 500).toFixed(1)} Rim</span>
              </div>
            </div>

            {/* DIPRINT HARI INI */}
            <div className="bg-[#FF2A6D] text-white brutal-border-4 brutal-shadow p-5 flex flex-col justify-between">
              <div>
                <span className="text-xs font-black uppercase bg-black text-[#FF2A6D] px-2 py-0.5 brutal-border-sm">
                  DIPRINT HARI INI
                </span>
                <div className="text-4xl sm:text-5xl font-black mt-3">
                  {todayStats.printedToday.toLocaleString("id-ID")}
                  <span className="text-base font-bold ml-1">lembar</span>
                </div>
              </div>
              <div className="mt-4 pt-3 border-t-2 border-black text-xs font-extrabold text-black">
                <span className="bg-white px-2 border-2 border-black">TANGGAL: {todayStr}</span>
              </div>
            </div>

            {/* RESTOCK HARI INI */}
            <div className="bg-[#05FF00] text-black brutal-border-4 brutal-shadow p-5 flex flex-col justify-between">
              <div>
                <span className="text-xs font-black uppercase bg-black text-[#05FF00] px-2 py-0.5 brutal-border-sm">
                  RESTOCK HARI INI
                </span>
                <div className="text-4xl sm:text-5xl font-black mt-3">
                  +{todayStats.restockedToday.toLocaleString("id-ID")}
                  <span className="text-base font-bold ml-1">lembar</span>
                </div>
              </div>
              <div className="mt-4 pt-3 border-t-2 border-black text-xs font-extrabold">
                <span className="bg-white px-2 border-2 border-black">+{(todayStats.restockedToday / 500).toFixed(1)} Rim Masuk</span>
              </div>
            </div>

            {/* TOTAL RECORD TRANSAKSI */}
            <div className="bg-[#00E5FF] text-black brutal-border-4 brutal-shadow p-5 flex flex-col justify-between">
              <div>
                <span className="text-xs font-black uppercase bg-black text-[#00E5FF] px-2 py-0.5 brutal-border-sm">
                  TOTAL RECORD LOG
                </span>
                <div className="text-4xl sm:text-5xl font-black mt-3">
                  {transactions.length}
                  <span className="text-base font-bold ml-1">entri</span>
                </div>
              </div>
              <div className="mt-4 pt-3 border-t-2 border-black text-xs font-extrabold">
                <span className="bg-white px-2 border-2 border-black">STATUS: LIVE UPDATED</span>
              </div>
            </div>

          </section>

          {/* STOCK BREAKDOWN PER PAPER TYPE */}
          <section className="bg-white brutal-border-4 brutal-shadow p-5 mb-8">
            <h2 className="text-xl font-black mb-4 flex items-center gap-2">
              <span className="bg-black text-white px-2 py-0.5">📦</span> 
              Rincian Stok Per Jenis Kertas
            </h2>

            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
              {DEFAULT_PAPER_TYPES.map(paper => {
                const count = stockSummary[paper] || 0;
                const isLow = count < 100;
                return (
                  <div key={paper} className={`brutal-border p-3 ${isLow ? "bg-[#FF2A6D] text-white" : "bg-[#F4F0EA] text-black"}`}>
                    <div className="text-xs font-black uppercase tracking-wider truncate" title={paper}>{paper}</div>
                    <div className="text-2xl font-black mt-1">
                      {count.toLocaleString("id-ID")} <span className="text-xs font-normal">lbr</span>
                    </div>
                    <div className="text-[10px] font-extrabold opacity-80 mt-1">
                      ≈ {(count / 500).toFixed(1)} Rim
                    </div>
                  </div>
                );
              })}
            </div>
          </section>

          {/* ACTION FORMS SECTION (SPLIT / TABS) */}
          <section className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            
            {/* FORM 1: RESTOCK KERTAS */}
            <div className="bg-white brutal-border-4 brutal-shadow p-6 relative">
              <div className="bg-[#05FF00] text-black font-black text-lg px-3 py-1 brutal-border inline-block mb-4">
                ➕ FORM 1: RESTOCK KERTAS (STOK MASUK)
              </div>
              
              <form onSubmit={handleAddRestock} className="flex flex-col gap-4">
                <div>
                  <label className="block text-xs font-black uppercase mb-1">1. Jenis Kertas</label>
                  <select 
                    value={restockForm.paperType}
                    onChange={e => setRestockForm({...restockForm, paperType: e.target.value})}
                    className="w-full brutal-input cursor-pointer"
                  >
                    {DEFAULT_PAPER_TYPES.map(t => (
                      <option key={t} value={t}>{t}</option>
                    ))}
                  </select>
                </div>

                <div className="grid grid-cols-3 gap-3">
                  <div className="col-span-2">
                    <label className="block text-xs font-black uppercase mb-1">2. Jumlah Restock</label>
                    <input 
                      type="number" 
                      min="1"
                      placeholder="Contoh: 5"
                      value={restockForm.quantityValue}
                      onChange={e => setRestockForm({...restockForm, quantityValue: e.target.value})}
                      className="w-full brutal-input"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-black uppercase mb-1">Satuan</label>
                    <select 
                      value={restockForm.unitType}
                      onChange={e => setRestockForm({...restockForm, unitType: e.target.value})}
                      className="w-full brutal-input font-bold bg-[#FFD600]"
                    >
                      <option value="rim">RIM (500 lbr)</option>
                      <option value="sheet">LEMBAR</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-black uppercase mb-1">3. Petugas / Admin Restock</label>
                  <input 
                    type="text" 
                    placeholder="Nama Petugas (misal: Budi)"
                    value={restockForm.user}
                    onChange={e => setRestockForm({...restockForm, user: e.target.value})}
                    className="w-full brutal-input"
                  />
                </div>

                <div>
                  <label className="block text-xs font-black uppercase mb-1">4. Catatan / Supplier</label>
                  <input 
                    type="text" 
                    placeholder="Misal: Toko PaperJaya / Pembelian Darurat"
                    value={restockForm.notes}
                    onChange={e => setRestockForm({...restockForm, notes: e.target.value})}
                    className="w-full brutal-input"
                  />
                </div>

                <button 
                  type="submit" 
                  className="brutal-btn bg-[#05FF00] text-black py-3 text-sm font-black tracking-wider mt-2"
                >
                  + SIMPAN RESTOCK KERTAS
                </button>
              </form>
            </div>

            {/* FORM 2: NGEPRINT HARI INI */}
            <div className="bg-white brutal-border-4 brutal-shadow p-6 relative">
              <div className="bg-[#FF2A6D] text-white font-black text-lg px-3 py-1 brutal-border inline-block mb-4">
                🖨️ FORM 2: NGEPRINT HARI INI (STOK KELUAR)
              </div>

              <form onSubmit={handleAddPrint} className="flex flex-col gap-4">
                <div>
                  <label className="block text-xs font-black uppercase mb-1">1. Jenis Kertas Dipakai</label>
                  <select 
                    value={printForm.paperType}
                    onChange={e => setPrintForm({...printForm, paperType: e.target.value})}
                    className="w-full brutal-input cursor-pointer"
                  >
                    {DEFAULT_PAPER_TYPES.map(t => (
                      <option key={t} value={t}>{t} (Sisa: {stockSummary[t] || 0} lbr)</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-black uppercase mb-1">2. Jumlah Lembar Diprint</label>
                  <input 
                    type="number" 
                    min="1"
                    placeholder="Contoh: 45"
                    value={printForm.quantitySheets}
                    onChange={e => setPrintForm({...printForm, quantitySheets: e.target.value})}
                    className="w-full brutal-input"
                    required
                  />
                </div>

                <div>
                  <label className="block text-xs font-black uppercase mb-1">3. Operator / User Ngeprint</label>
                  <input 
                    type="text" 
                    placeholder="Nama Operator (misal: Siti)"
                    value={printForm.user}
                    onChange={e => setPrintForm({...printForm, user: e.target.value})}
                    className="w-full brutal-input"
                  />
                </div>

                <div>
                  <label className="block text-xs font-black uppercase mb-1">4. Keperluan / Keterangan Print</label>
                  <input 
                    type="text" 
                    placeholder="Misal: Cetak Modul Training 3 Rangkap"
                    value={printForm.notes}
                    onChange={e => setPrintForm({...printForm, notes: e.target.value})}
                    className="w-full brutal-input"
                  />
                </div>

                <button 
                  type="submit" 
                  className="brutal-btn bg-[#FF2A6D] text-white py-3 text-sm font-black tracking-wider mt-2"
                >
                  - CATAT CETAK HARI INI
                </button>
              </form>
            </div>

          </section>

          {/* TRANSACTION HISTORY TABLE SECTION */}
          <section className="bg-white brutal-border-4 brutal-shadow p-6">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b-4 border-black">
              <div>
                <h2 className="text-2xl font-black tracking-tight">
                  📜 RIWAYAT TRANSAKSI & LOG AKTIVITAS
                </h2>
                <p className="text-xs font-bold text-gray-600 mt-1">Daftar lengkap alur restock & penggunaan kertas</p>
              </div>

              {/* SEARCH & FILTERS */}
              <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <input 
                  type="text" 
                  placeholder="🔍 Cari log..."
                  value={searchTerm}
                  onChange={e => setSearchTerm(e.target.value)}
                  className="brutal-input text-xs py-1.5 px-3 w-full sm:w-48"
                />

                <select 
                  value={filterType} 
                  onChange={e => setFilterType(e.target.value)}
                  className="brutal-input text-xs py-1.5 px-2 bg-[#FFD600] font-bold"
                >
                  <option value="ALL">SEMUA TIPE</option>
                  <option value="RESTOCK">RESTOCK (+)</option>
                  <option value="PRINT">PRINT (-)</option>
                </select>

                <select 
                  value={filterPaper} 
                  onChange={e => setFilterPaper(e.target.value)}
                  className="brutal-input text-xs py-1.5 px-2 bg-[#00E5FF] font-bold"
                >
                  <option value="ALL">SEMUA KERTAS</option>
                  {DEFAULT_PAPER_TYPES.map(p => (
                    <option key={p} value={p}>{p}</option>
                  ))}
                </select>
              </div>
            </div>

            {/* TABLE CONTENT */}
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse border-3 border-black">
                <thead>
                  <tr className="bg-black text-white text-xs font-black uppercase tracking-wider">
                    <th className="p-3 border-r-2 border-white">ID / WAKTU</th>
                    <th className="p-3 border-r-2 border-white">TIPE</th>
                    <th className="p-3 border-r-2 border-white">JENIS KERTAS</th>
                    <th className="p-3 border-r-2 border-white text-right">JUMLAH</th>
                    <th className="p-3 border-r-2 border-white">PETUGAS</th>
                    <th className="p-3 border-r-2 border-white">CATATAN / KEPERLUAN</th>
                    <th className="p-3 text-center">AKSI</th>
                  </tr>
                </thead>
                <tbody className="divide-y-2 divide-black text-xs font-bold">
                  {filteredTransactions.length === 0 ? (
                    <tr>
                      <td colSpan="7" className="p-8 text-center text-gray-500 font-bold bg-[#F4F0EA]">
                        TIDAK ADA LOG TRANSAKSI YANG COCOK.
                      </td>
                    </tr>
                  ) : (
                    filteredTransactions.map((item, idx) => {
                      const isRestock = item.type === "RESTOCK";
                      return (
                        <tr key={item.id} className={idx % 2 === 0 ? "bg-white" : "bg-[#F4F0EA]"}>
                          <td className="p-3 border-r-2 border-black font-mono">
                            <span className="block font-black text-black">{item.id}</span>
                            <span className="text-[10px] text-gray-600">{item.dateStr} {item.timeStr}</span>
                          </td>
                          <td className="p-3 border-r-2 border-black">
                            <span className={`px-2 py-0.5 brutal-border-sm font-black text-[10px] ${
                              isRestock ? "bg-[#05FF00] text-black" : "bg-[#FF2A6D] text-white"
                            }`}>
                              {isRestock ? "RESTOCK" : "PRINT"}
                            </span>
                          </td>
                          <td className="p-3 border-r-2 border-black font-extrabold">{item.paperType}</td>
                          <td className={`p-3 border-r-2 border-black text-right font-black text-sm ${
                            isRestock ? "text-green-700" : "text-red-600"
                          }`}>
                            {isRestock ? `+${item.quantity}` : `-${item.quantity}`} <span className="text-[10px]">lbr</span>
                          </td>
                          <td className="p-3 border-r-2 border-black">{item.user}</td>
                          <td className="p-3 border-r-2 border-black text-gray-700">{item.notes}</td>
                          <td className="p-3 text-center">
                            {deleteConfirmId === item.id ? (
                              <div className="flex items-center justify-center gap-1">
                                <button 
                                  onClick={() => handleDeleteTransaction(item.id)}
                                  className="bg-red-600 text-white px-2 py-0.5 text-[10px] font-black brutal-border"
                                >
                                  YA
                                </button>
                                <button 
                                  onClick={() => setDeleteConfirmId(null)}
                                  className="bg-gray-300 text-black px-2 py-0.5 text-[10px] font-black brutal-border"
                                >
                                  BATAL
                                </button>
                              </div>
                            ) : (
                              <button 
                                onClick={() => setDeleteConfirmId(item.id)}
                                className="brutal-btn bg-[#FF2A6D] text-white px-2 py-1 text-[10px]"
                                title="Hapus Log"
                              >
                                🗑️ HAPUS
                              </button>
                            )}
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="mt-12 text-center text-xs font-black uppercase text-gray-500 tracking-wider">
            PAPER STOK TRACKER // SYSTEM BUILT WITH PURE NEO-BRUTALISM PRINCIPLES
          </footer>

        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
